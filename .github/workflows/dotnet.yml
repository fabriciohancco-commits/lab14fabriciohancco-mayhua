name: Build and publish .NET 8
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore lab14fabriciohancco.sln
      - name: Build Release
        run: dotnet build lab14fabriciohancco.sln --configuration Release --no-restore
      - name: Publish
        run: dotnet publish lab14fabriciohancco/lab14fabriciohancco.csproj --configuration Release --no-restore --output ./published
      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: lab14-published-app
          path: published/
          if-no-files-found: error
