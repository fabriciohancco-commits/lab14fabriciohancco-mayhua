services:
  - type: web
    name: lab14fabriciohancco
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: lab14-inventory-db
          property: connectionString

databases:
  - name: lab14-inventory-db
    databaseName: lab14_inventory
    user: lab14_user
    postgresMajorVersion: "18"
    plan: free
